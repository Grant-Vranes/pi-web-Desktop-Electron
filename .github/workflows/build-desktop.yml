name: Build Desktop Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (e.g. 0.8.9). Leave empty to use package.json"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply version override
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
        shell: bash
        run: |
          npm version "${{ github.event.inputs.version }}" --no-git-tag-version --allow-same-version
          echo "Overrode version to $(node -p "require('./package.json').version")"

      - name: Derive tag version (tag trigger)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Set version to $VERSION from tag $TAG"

      - name: Build Next.js (webpack)
        run: npm run build

      - name: Build & package desktop app
        run: npm run desktop:dist
        env:
          # electron-builder is run with --publish never (see package.json desktop:dist);
          # release creation and asset upload are handled by the Release step below.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-web-desktop-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Release
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          FILES=$(ls dist/*.dmg dist/*.exe dist/*.AppImage dist/*.deb dist/latest*.yml 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "No release assets found"; exit 1
          fi
          # Create release if it doesn't exist, otherwise just append/overwrite assets
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, uploading assets"
            gh release upload "$GITHUB_REF_NAME" $FILES --clobber
          else
            echo "Creating release $GITHUB_REF_NAME"
            gh release create "$GITHUB_REF_NAME" $FILES --generate-notes --title "$GITHUB_REF_NAME"
          fi
